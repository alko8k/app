name: Recovrd
options:
  bundleIdPrefix: com.egeatar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.101.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.93.0

schemes:
  Recovrd:
    build:
      targets:
        Recovrd: all
        RecovrdTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Recovrd/Recovrd.storekit
    test:
      config: Debug
      targets:
        - RecovrdTests

targets:
  Recovrd:
    type: application
    platform: iOS
    sources:
      - path: Recovrd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.egeatar.recovrd
        # Apple Developer Team ID (developer.apple.com → Membership). Needed to sign for device/TestFlight.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Recovrd/Recovrd.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Public SDK keys. Empty = purchases won't load / analytics off.
        REVENUECAT_API_KEY: ""
        POSTHOG_API_KEY: ""
    info:
      path: Recovrd/Info.plist
      properties:
        CFBundleDisplayName: Recovrd
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Recovrd reads your sleep, steps and workouts to score how well you recovered each day."
        NSHealthUpdateUsageDescription: "Recovrd only writes sample data in debug builds for testing."
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        PostHogAPIKey: $(POSTHOG_API_KEY)
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: PostHog
        product: PostHog

  RecovrdTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RecovrdTests
    dependencies:
      - target: Recovrd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
